{% extends "registration/layout.html" %}
{% load i18n %}

{% block content %}
    <div class="page-inner-container">
        <div class="user-page">
            <div class="ui tabular menu content-tabs">
                <span class="heading">{% trans 'Login' %}</span>
            </div>
            <form action="" name="profile-edit-form" method="POST" class="ui form contact-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="inline field">
                        {{ field.errors }}
                        {{ field.label_tag }}
                        {{ field }}
                    </div>
                {% endfor %}
                {# ulogin_widget #}
                <hr class="hr">
                <button type="submit" class="small ui green button">
                    {% trans 'Login' %}
                </button>
                <a href="{% url 'accounts:signup' %}" class="small ui green button">
                    {% trans 'Signup' %}
                </a>
                <a href="{% url 'accounts:signup' %}#?remember=true" class="item">
                    {% trans 'Remind password' %}
                </a>
            </form>
        </div>
    </div>
{% endblock %}
