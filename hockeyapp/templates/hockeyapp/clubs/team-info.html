<div class="team-info">
    <div id="team-heading" class="team-heading">
        <a class="ui red button my-team-btn">+ Я БОЛЕЮ ЗА ЭТУ КОМАНДУ</a>
        <div id="team-logo" class="team-logo"><img src="{{ logo|default:"" }}" alt="Sportomatics" class="team-logo-image"></div>
        <a id="team-name"  href="{% url 'hockeyapp:club' pk %}" class="team-name">{{ title }}
            {% if address.title %}
                <span>({{ address.title }})</span>
            {% endif %}
        </a>
    </div>
    <ul class="info-list">
        <li class="info-item"><i class="browser icon"></i> Сайт: <a href="{{ site }}">{{ site }}</a></li>
        <li class="info-item"><i class="mail icon"></i> E-mail: pochta@ska.ru</li>
        <li class="info-item"><i class="phone icon"></i> Тел.: +7 (812) 234 72 37</li>
    </ul>
</div>
