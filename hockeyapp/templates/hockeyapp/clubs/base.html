{% extends "base.html" %}

{% block extrahead %}
    {{ block.super }}
    <style>
        {{ object.style }}
    </style>
    {% if object.rgb %}
    <style>
        .clubs-page .ui.red.button, .clubs-page .ui.red.buttons .button {
            background-color: rgba(255, 0, 0, 0.6) !important; /* номер игрока secondary */
            color: #ffffff; /* подходящий цвет для текста на кнопке */
        }
        .clubs-page .ui.tabular.menu .item {
            color: rgba(255, 0, 0, 0.6); /* текст табов secondary */
        }
        .clubs-team-page .team-player-number{
            background: rgba(255, 0, 0, 0.6) !important; /* номер игрока secondary */
        }
        .clubs-page .heading{
            color: rgba(255, 0, 0, 0.6) !important; /* заголовок сезонов secondary */
        }
        .clubs-page .team-info .info-item .icon{
            color: rgba(0,0,0, 1); /* иконки над меню primary */
        }
        .clubs-page .page-menu.ui.green.menu {
            background: rgba(0,0,0, 1) !important; /* цвет меню primary */
        }
    </style>
    {% endif %}
{% endblock %}


{% block header %}
    {% include "partial/header.html" with user_card_menu_active="clubs" %}
{% endblock %}
