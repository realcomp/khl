<div class="ui grid">
    <div class="row">
        <div class="twelve wide column">
            <div class="player-card-block">
                <img src="{{ photo }}" width="105" alt="" class="player-card-avatar">
                <div class="player-card-desc">
                    <div class="player-card-name">{{ fio }}</div>
                    <div class="player-card-amplua">Амплуа: {{ line }}</div>
                    <ul class="player-card-list">
                        <li class="player-card-item">Рост: {{ height }} см.</li>
                        <li class="player-card-item">Вес: {{ weight }} кг.</li>
                        <li class="player-card-item">Хват: правый</li>
                    </ul>
                    <ul class="player-card-list player-card-list_nb">
                        <li class="player-card-item">Дата рождения: {{ birth_date }}</li>
                        {# TODO: month/months, year/years #}
                        <li class="player-card-item">Возраст: {{ age.0 }} лет {{ age.1 }} месяцев</li>
                        <li class="player-card-item">Гражданство: Россия</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="four wide column">
            <div class="align-center">
                <a class="ui mini orange button player-like-btn">+мне нравится этот игрок</a>
                <span class="player-likers">Нравится: <a href="#" class="player-likers-link">23 участникам</a></span>
            </div>
        </div>
    </div>
</div>
